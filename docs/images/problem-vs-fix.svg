<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-labelledby="t d">
  <title id="t">The problem and the fix</title>
  <desc id="d">A system-wide jiggler moves the cursor over Mail while Windows App sits behind it, so the remote PC sees no input. RemoteKeepAliver raises the Australia Desktop window and jiggles inside it, so the remote PC sees input.</desc>
  <rect width="960" height="460" rx="16" fill="#1f2937"/>
  <rect x="0" y="0" width="960" height="460" rx="16" fill="none" stroke="#6b7280" stroke-width="2"/>
  <line x1="480" y1="20" x2="480" y2="440" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 6"/>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#e5e7eb"/>
    </marker>
  </defs>
  <g font-family="-apple-system, Helvetica, Arial, sans-serif">
    <!-- Left panel -->
    <text x="240" y="44" text-anchor="middle" font-size="18" font-weight="700" fill="#fca5a5">System-wide jiggler</text>
    <rect x="50" y="64" width="380" height="200" rx="12" fill="#374151" stroke="#9ca3af" stroke-width="2"/>
    <rect x="70" y="84" width="300" height="150" rx="10" fill="#2563eb" stroke="#93c5fd" stroke-width="2"/>
    <text x="90" y="110" font-size="14" fill="#ffffff">Windows App (behind)</text>
    <text x="90" y="130" font-size="14" fill="#dbeafe">Australia Desktop</text>
    <rect x="130" y="150" width="270" height="100" rx="10" fill="#b45309" stroke="#fcd34d" stroke-width="2"/>
    <text x="150" y="178" font-size="16" font-weight="700" fill="#ffffff">Mail (frontmost)</text>
    <text x="150" y="200" font-size="14" fill="#ffffff">Cursor jiggles here</text>
    <path d="M300 214 L300 238 L307 232 L313 244 L318 242 L312 230 L321 230 z" fill="#ffffff" stroke="#111827" stroke-width="1"/>
    <path d="M330 222 q8 -8 16 0 M330 232 q8 8 16 0" fill="none" stroke="#fde68a" stroke-width="2"/>
    <line x1="240" y1="264" x2="240" y2="320" stroke="#e5e7eb" stroke-width="3" marker-end="url(#ar)"/>
    <rect x="70" y="326" width="340" height="84" rx="12" fill="#7f1d1d" stroke="#fca5a5" stroke-width="2"/>
    <text x="240" y="354" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Remote PC</text>
    <text x="240" y="378" text-anchor="middle" font-size="14" fill="#fecaca">no input, idle timer runs,</text>
    <text x="240" y="396" text-anchor="middle" font-size="14" fill="#fecaca">disconnect</text>
    <!-- Right panel -->
    <text x="720" y="44" text-anchor="middle" font-size="18" font-weight="700" fill="#86efac">RemoteKeepAliver</text>
    <rect x="530" y="64" width="380" height="200" rx="12" fill="#374151" stroke="#9ca3af" stroke-width="2"/>
    <rect x="740" y="84" width="150" height="90" rx="10" fill="#b45309" stroke="#fcd34d" stroke-width="2"/>
    <text x="756" y="110" font-size="14" fill="#ffffff">Mail (behind)</text>
    <rect x="550" y="110" width="300" height="140" rx="10" fill="#2563eb" stroke="#93c5fd" stroke-width="2"/>
    <text x="568" y="136" font-size="16" font-weight="700" fill="#ffffff">Australia Desktop</text>
    <text x="568" y="158" font-size="14" fill="#dbeafe">Raised, cursor jiggles inside</text>
    <path d="M700 190 L700 214 L707 208 L713 220 L718 218 L712 206 L721 206 z" fill="#ffffff" stroke="#111827" stroke-width="1"/>
    <path d="M730 198 q8 -8 16 0 M730 208 q8 8 16 0" fill="none" stroke="#fde68a" stroke-width="2"/>
    <line x1="720" y1="264" x2="720" y2="320" stroke="#e5e7eb" stroke-width="3" marker-end="url(#ar)"/>
    <rect x="550" y="326" width="340" height="84" rx="12" fill="#14532d" stroke="#86efac" stroke-width="2"/>
    <text x="720" y="354" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Remote PC</text>
    <text x="720" y="378" text-anchor="middle" font-size="14" fill="#bbf7d0">input received, session alive,</text>
    <text x="720" y="396" text-anchor="middle" font-size="14" fill="#bbf7d0">Teams Available</text>
    <text x="480" y="445" text-anchor="middle" font-size="14" fill="#d1d5db"> </text>
  </g>
</svg>
