<svg xmlns="http://www.w3.org/2000/svg" width="480" height="520" viewBox="0 0 480 520" role="img" aria-labelledby="t d">
  <title id="t">RemoteKeepAliver menu</title>
  <desc id="d">Mock of the menu bar menu: status line, target line, toggles with check marks, submenus with chevrons, and Quit.</desc>
  <rect width="480" height="520" rx="16" fill="#1f2937"/>
  <rect x="40" y="20" width="400" height="480" rx="12" fill="#374151" stroke="#9ca3af" stroke-width="2"/>
  <g font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="15" fill="#f3f4f6">
    <text x="60" y="50" font-size="14" fill="#d1d5db">RemoteKeepAliver</text>
    <line x1="52" y1="60" x2="428" y2="60" stroke="#6b7280"/>
    <text x="60" y="84" fill="#d1d5db">Status: Away (idle 3:12)</text>
    <text x="60" y="108" fill="#d1d5db">Target: Australia Desktop</text>
    <line x1="52" y1="120" x2="428" y2="120" stroke="#6b7280"/>
    <text x="60" y="144">&#10003;</text><text x="84" y="144">Enabled</text>
    <text x="84" y="170">Start after idle</text><text x="410" y="170" text-anchor="end" fill="#d1d5db">2 min</text><text x="420" y="170" text-anchor="end">&#8250;</text>
    <text x="84" y="196">Jiggle every</text><text x="410" y="196" text-anchor="end" fill="#d1d5db">1 min</text><text x="420" y="196" text-anchor="end">&#8250;</text>
    <text x="60" y="222">&#10003;</text><text x="84" y="222">Keep Mac awake</text>
    <text x="60" y="248">&#10003;</text><text x="84" y="248">Keep display awake</text>
    <text x="60" y="274">&#10003;</text><text x="84" y="274">Return focus after jiggle</text>
    <text x="84" y="300">Also press a key (F15)</text>
    <text x="84" y="326">Launch at login</text>
    <line x1="52" y1="340" x2="428" y2="340" stroke="#6b7280"/>
    <rect x="52" y="350" width="376" height="30" rx="6" fill="#2563eb"/>
    <text x="84" y="371" fill="#ffffff">Jiggle now</text>
    <text x="84" y="402">Grant Accessibility access&#8230;</text>
    <text x="84" y="426" font-size="13" fill="#d1d5db">(shown only when trust is missing)</text>
    <line x1="52" y1="440" x2="428" y2="440" stroke="#6b7280"/>
    <text x="84" y="468">Quit</text>
  </g>
</svg>
